[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auragen"
version = "1.0.0"
description = "AuraGen — media production suite for The Unified Spirit: AI image/video generation, editing, branding and reference-guided control with multi-provider fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Unified Spirit" }]
keywords = ["ai", "image-generation", "video-generation", "cli", "flux", "stable-diffusion"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pillow>=10.3",
]

[project.optional-dependencies]
fal = ["fal-client>=0.5"]
replicate = ["replicate>=0.32"]
huggingface = ["huggingface-hub>=0.24"]
all = ["fal-client>=0.5", "replicate>=0.32", "huggingface-hub>=0.24"]

[project.scripts]
auragen = "auragen.main:run"

[tool.setuptools.packages.find]
include = ["auragen*"]

[tool.setuptools.package-data]
"auragen.config" = ["brand.json"]
